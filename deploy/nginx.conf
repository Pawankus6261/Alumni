# Nginx configuration for BGI Alumento on AWS EC2
# Place this in /etc/nginx/sites-available/alumni and link to /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    server_name _;

    # React Frontend build files
    root /var/www/alumni/dist;
    index index.html;

    # Gzip compression for fast loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Max body size for photo uploads (5MB)
    client_max_body_size 10M;

    # Static assets caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to FastAPI backend
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90;
    }

    # Local fallback for media if any (when S3 is not used for specific files)
    location /media/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }

    # Single-page application router fallback: all non-asset requests return index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
